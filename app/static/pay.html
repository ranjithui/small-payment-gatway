<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Pay fee · FeeFlow</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main class="page" id="app">
  <div class="card"><p class="muted">Loading your fee details…</p></div>
</main>

<template id="tpl">
  <header class="card header">
    <div class="logo" id="logo"></div>
    <div>
      <div class="brand">FeeFlow</div>
      <h1 id="centreName"></h1>
    </div>
  </header>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 style="margin:0" id="studentName"></h2>
      <span class="pill" id="statusPill"></span>
    </div>
    <p class="muted small" style="margin:2px 0 12px">Student ID <span id="studentId"></span></p>
    <dl class="kv">
      <dt>Fee</dt><dd id="feeDesc"></dd>
      <dt>Month</dt><dd id="feeMonth"></dd>
      <dt>Total fee</dt><dd id="feeTotal"></dd>
      <dt>Amount paid</dt><dd id="feePaid"></dd>
      <dt>Due date</dt><dd id="feeDue"></dd>
      <dt>Payment reference</dt><dd id="feeRef"></dd>
      <dt>Outstanding</dt><dd class="big" id="feeOutstanding"></dd>
    </dl>
  </section>

  <section class="card hidden" id="messageCard"><div class="banner" id="messageBanner"></div></section>

  <!-- Payment options -->
  <section class="card hidden" id="upiErrorCard"><div class="banner bad" id="upiErrorMsg"></div></section>

  <section class="card hidden" id="paySection">
    <h2 style="margin-bottom:2px">Pay <span id="payAmt"></span></h2>
    <p class="muted small" style="margin:0 0 12px">To <b id="payPayee"></b> &middot; Reference <b id="payRef"></b></p>

    <p class="banner info hidden" id="desktopNote">You're on a computer. Scan the QR code below with any UPI app
      on your phone, or open this payment link on your phone.</p>

    <div id="payWays">
      <!-- One-tap UPI intent (primary for business UPI IDs; "try" option for personal UPI IDs) -->
      <div id="oneTapBlock">
        <button class="btn" id="payUpiBtn">Pay using UPI</button>
        <p class="muted small" id="payUpiHint" style="text-align:center;margin:6px 0 0">Opens Google Pay, PhonePe, Paytm
          or any UPI app on this phone. The amount and reference are filled in.</p>
        <p class="banner hidden" id="intentMsg" style="margin-top:10px"></p>
      </div>

      <div class="actions" id="choiceRow">
        <button class="btn secondary" style="flex:1" id="showQrBtn">Show QR Code</button>
        <button class="btn secondary" style="flex:1" id="showManualBtn">Pay Manually</button>
      </div>

      <div id="qrBlock" class="panel hidden">
        <div class="qr">
          <div class="actions" id="qrModeRow" style="justify-content:center;margin-bottom:8px">
            <button class="btn secondary sm" id="qrModeAny">Without amount (most reliable)</button>
            <button class="btn secondary sm" id="qrModeAmt">With amount</button>
          </div>
          <img id="qrImg" alt="UPI QR code for this fee">
          <p class="muted small">Scan with any UPI app &middot; pays <b id="qrPayee"></b> (<span id="vpa"></span>)</p>
          <p class="banner warn small hidden" id="qrAmountNote">This QR has no amount: enter <b id="qrAmtText"></b> in your UPI
            app and add reference <b id="qrRefText"></b> in the note.</p>
          <div class="actions" style="justify-content:center">
            <a class="btn secondary sm" id="qrSave" download>Save QR</a>
            <a class="btn ghost sm" id="qrSaveHi" download>High-resolution QR</a>
          </div>
          <p class="muted small" style="margin-top:8px">On this phone: save the QR, then open your UPI app &rarr; <b>Scan QR</b>
            &rarr; tap the gallery/photo icon &rarr; choose the saved image.<br>
            If the image opens instead of downloading, press and hold it and choose <b>Download / Save image</b>.</p>
        </div>
      </div>

      <div id="manualBlock" class="panel hidden">
        <h3 style="margin-top:0" id="manualTitle">Pay manually</h3>
        <p class="small muted hidden" id="personalNote" style="margin:-4px 0 8px">This centre receives fees on a personal UPI ID.
          Pay it from inside your UPI app as below - it works in every UPI app.</p>
        <div class="copyrow"><span class="muted small">Centre</span><b id="mCentre"></b></div>
        <div class="copyrow"><span class="muted small">Pay to</span><b id="mPayee"></b></div>
        <div class="copyrow"><span class="muted small">UPI ID</span><b id="mVpa"></b><button class="btn secondary sm copy" data-copy="vpa" data-label="Copy UPI ID">Copy UPI ID</button></div>
        <div class="copyrow hidden" id="mMobileRow"><span class="muted small">Or mobile</span><b id="mMobile"></b><button class="btn secondary sm copy" data-copy="mobile" data-label="Copy number">Copy number</button></div>
        <div class="copyrow"><span class="muted small">Amount</span><b id="mAmt"></b><button class="btn secondary sm copy" data-copy="amount" data-label="Copy amount">Copy amount</button></div>
        <div class="copyrow"><span class="muted small">Reference</span><b id="mRef"></b><button class="btn secondary sm copy" data-copy="reference" data-label="Copy reference">Copy reference</button></div>
        <div class="copyrow"><span class="muted small">Student</span><b id="mStudent"></b></div>
        <div class="copyrow"><span class="muted small">Fee month</span><b id="mMonth"></b></div>
        <button class="btn secondary copy" data-copy="all" data-label="Copy payment details" style="margin-top:10px">Copy payment details</button>
        <div id="openAppBlock" class="hidden" style="margin-top:12px">
          <p class="small" style="margin:0 0 6px"><b>Open your UPI app</b> (it opens the app only - no payment is started):</p>
          <div class="apps" id="openAppButtons">
            <button class="app" data-open="GPAY"><span class="ico" style="background:#1a73e8">G</span>Google Pay</button>
            <button class="app" data-open="PHONEPE"><span class="ico" style="background:#5f259f">Pe</span>PhonePe</button>
            <button class="app" data-open="PAYTM"><span class="ico" style="background:#00baf2">P</span>Paytm</button>
            <button class="app" data-open="BHIM"><span class="ico" style="background:#f07c00">B</span>BHIM</button>
          </div>
        </div>
        <ol class="small steps">
          <li>Tap <b>Copy UPI ID</b><span id="stepMobile" class="hidden"> (or <b>Copy number</b>)</span>.</li>
          <li>Open Google Pay, PhonePe, Paytm or another UPI app.</li>
          <li>Choose <b>Pay UPI ID or number</b> (Google Pay), <b>To Mobile Number / UPI ID</b> (PhonePe) or
            <b>UPI Money Transfer</b> (Paytm) and paste it.</li>
          <li>Check the beneficiary name shown is <b id="mPayee2"></b>.</li>
          <li>Enter <b id="mAmt2"></b> and add the reference in the note.</li>
          <li>Complete the payment, then return to FeeFlow and tap <b>I have paid</b>.</li>
        </ol>
      </div>
    </div>

    <details>
      <summary>Paying a different amount?</summary>
      <p class="muted small">Open your UPI app without a fixed amount, then tell us the amount you paid:</p>
      <button class="btn secondary" id="anyAmountBtn">Open UPI app (enter amount yourself)</button>
    </details>
    <p class="muted small">Never share your UPI PIN or OTP with anyone. FeeFlow will never ask for it.</p>
  </section>

  <!-- Post-payment question -->
  <section class="card hidden" id="askSection">
    <h2>Have you completed your payment?</h2>
    <div class="stack">
      <label class="check"><input type="checkbox" id="partialChk"> I paid only part of the amount</label>
      <div id="partialBox" class="hidden">
        <label for="partialAmt">Amount you actually paid (Rs.)</label>
        <input id="partialAmt" type="number" inputmode="decimal" min="1" step="0.01" placeholder="e.g. 1000">
      </div>
      <details>
        <summary>Add optional details</summary>
        <label for="optApp">UPI app used</label>
        <select id="optApp"><option value="">Not sure</option><option value="GPAY">Google Pay</option><option value="PHONEPE">PhonePe</option><option value="PAYTM">Paytm</option><option value="OTHER_UPI">Other UPI app</option><option value="QR">Scanned QR</option></select>
        <label for="optTime">Approximate payment time</label>
        <input id="optTime" type="time">
        <label for="optNote">Note for the tuition centre</label>
        <input id="optNote" maxlength="300" placeholder="e.g. paid from my husband's account">
      </details>
      <button class="btn ok" id="paidBtn">I have paid</button>
      <div class="actions">
        <button class="btn secondary" style="flex:1" id="processingBtn">Payment is processing</button>
        <button class="btn ghost" style="flex:1" id="failedBtn">Payment failed</button>
      </div>
      <p class="err" id="askErr"></p>
    </div>
  </section>

  <!-- Awaiting verification -->
  <section class="card hidden" id="waitSection">
    <div class="banner ok">Payment confirmation received</div>
    <dl class="kv" style="margin-top:12px">
      <dt>Status</dt><dd>Waiting for tuition centre verification</dd>
      <dt>Submitted</dt><dd id="declaredAt"></dd>
      <dt>Amount</dt><dd id="declaredAmt"></dd>
      <dt>Reference</dt><dd id="declRef"></dd>
    </dl>
    <p class="banner warn" style="margin-top:12px">Please do not pay again while this confirmation is being checked.</p>
    <div id="clarifyBox" class="hidden panel">
      <h3 style="margin-top:0">The tuition centre asked:</h3>
      <p id="clarifyQ"></p>
      <label for="clarifyNote">Your reply</label>
      <textarea id="clarifyNote" rows="3" maxlength="500"></textarea>
      <label for="clarifyTime">Approximate payment time (optional)</label>
      <input id="clarifyTime" type="time">
      <label for="clarifyRef">UPI transaction ID (optional - only if easy to find)</label>
      <input id="clarifyRef" maxlength="64" autocomplete="off">
      <button class="btn" style="margin-top:10px" id="clarifyBtn">Send details</button>
      <p class="err" id="clarifyErr"></p>
    </div>
    <details id="addInfo"><summary>Add more information</summary>
      <textarea id="moreNote" rows="2" maxlength="500" placeholder="Anything that helps the centre find your payment"></textarea>
      <button class="btn secondary" style="margin-top:8px" id="moreBtn">Send</button>
      <p class="err" id="moreErr"></p>
    </details>
  </section>

  <!-- Receipts -->
  <section class="card hidden" id="receiptSection">
    <h2>Receipts</h2>
    <div id="receiptList" class="stack"></div>
  </section>

  <section class="card" id="contactCard">
    <h3 style="margin-top:0">Need help?</h3>
    <p class="muted" style="margin:0">Contact <b id="contactName"></b>: <a id="contactPhone"></a></p>
  </section>
  <p class="foot">Secured by FeeFlow · Payments are verified by your tuition centre</p>
</template>

<script src="/static/js/pay.js"></script>
</body>
</html>
